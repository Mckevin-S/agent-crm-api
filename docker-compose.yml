# Relais – environnement complet de démonstration
#   docker compose up -d --build   puis   http://localhost:4200
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentcrm
      POSTGRES_USER: agentcrm
      POSTGRES_PASSWORD: agentcrm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentcrm -d agentcrm"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # CRM historique simulé (système externe, vocabulaire et format qui lui sont propres)
  crm-simulator:
    build: ./crm-simulator
    restart: on-failure
    ports:
      - "8090:8090"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/agentcrm
      DB_USERNAME: agentcrm
      DB_PASSWORD: agentcrm
      CRM_BASE_URL: http://crm-simulator:8090
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-change-me-in-production}
      DEMO_DATA: ${DEMO_DATA:-true}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
      crm-simulator:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    # Le front n'est exposé qu'une fois l'API prête : pas de 502 au démarrage
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure
    ports:
      - "4200:80"

volumes:
  db-data:
