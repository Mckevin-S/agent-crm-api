spring:
  application:
    name: agent-crm-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentcrm}
    username: ${DB_USERNAME:agentcrm}
    password: ${DB_PASSWORD:agentcrm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    validity: ${JWT_VALIDITY:PT8H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  crm:
    base-url: ${CRM_BASE_URL:http://localhost:8090}
    connect-timeout: 1s
    read-timeout: 2s
  demo:
    enabled: ${DEMO_DATA:false}

# Disjoncteur du CRM : au-delà de 50 % d'échecs sur 6 appels, on cesse d'appeler le CRM pendant 15 s
resilience4j:
  circuitbreaker:
    instances:
      crm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  retry:
    instances:
      crm:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    circuitbreakers:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
